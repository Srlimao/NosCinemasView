<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemas Dynamic Hub - Colombo Preferred Seats Explorer</title>
    
    <!-- Google Font: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen antialiased flex flex-col selection:bg-cyan-500 selection:text-neutral-950">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-40 bg-neutral-950/90 backdrop-blur-md border-b border-neutral-800/80 px-4 lg:px-8 py-3.5">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showMoviesView()">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-black text-neutral-950 text-base shadow-lg shadow-cyan-500/20">C</div>
                <div>
                    <h1 class="text-base font-black tracking-tight bg-gradient-to-r from-neutral-100 via-cyan-200 to-indigo-300 bg-clip-text text-transparent leading-none">
                        CINEMA DYNAMIC HUB
                    </h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-bold bg-cyan-950 text-cyan-300 border border-cyan-800/50">
                            📍 Colombo NOS
                        </span>
                        <span class="text-[10px] text-neutral-400">Sweet Spot Seat Scanner</span>
                    </div>
                </div>
            </div>

            <!-- Preferred Area Trigger -->
            <button onclick="PreferredModule.openPreferredModal()" class="w-full sm:w-auto flex items-center justify-between sm:justify-start gap-2.5 px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-semibold transition-all shadow-sm group">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 ring-2 ring-amber-400/30 group-hover:scale-125 transition-transform"></span>
                    <span class="font-bold">Preferred Area:</span>
                </div>
                <span id="preferred-seats-summary" class="font-mono text-neutral-200">Loading...</span>
                <span class="text-amber-400/80 group-hover:translate-x-0.5 transition-transform">⚙️</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6">

        <!-- Controls Bar -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-6 pb-5 border-b border-neutral-800">
            <!-- Search -->
            <div class="relative flex-1 max-w-md">
                <input id="search-input" type="text" placeholder="Search movies by title..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2 text-xs text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex rounded-lg bg-neutral-900 border border-neutral-800 p-0.5 text-xs">
                    <button data-format-filter="ALL" class="px-3 py-1 rounded-md font-bold bg-cyan-500 text-neutral-950 transition-colors">All Types</button>
                    <button data-format-filter="IMAX" class="px-3 py-1 rounded-md text-neutral-300 hover:text-white transition-colors">IMAX</button>
                    <button data-format-filter="ATMOS" class="px-3 py-1 rounded-md text-neutral-300 hover:text-white transition-colors">ATMOS</button>
                    <button data-format-filter="STANDARD" class="px-3 py-1 rounded-md text-neutral-300 hover:text-white transition-colors">2D / Regular</button>
                </div>

                <label class="flex items-center gap-2 cursor-pointer bg-neutral-900/80 border border-neutral-800 hover:border-neutral-700 px-3 py-1.5 rounded-lg text-xs font-medium text-neutral-300 transition-colors select-none">
                    <input id="filter-preferred-toggle" type="checkbox" class="w-3.5 h-3.5 rounded bg-neutral-800 border-neutral-700 text-cyan-500 focus:ring-0 focus:ring-offset-0 cursor-pointer">
                    <span>Only with preferred seats free</span>
                </label>
            </div>
        </div>

        <!-- View 1: Movies Grid -->
        <section id="view-movies">
            <div id="movies-status" class="py-12 text-center text-sm text-neutral-400">Loading movies from Cinemas NOS...</div>
            <div id="movies-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
        </section>

        <!-- View 2: Sessions Details -->
        <section id="view-sessions" class="hidden">
            <button onclick="showMoviesView()" class="mb-4 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-xs font-semibold text-neutral-300 transition-colors">
                &larr; Back to Movie Catalog
            </button>

            <!-- Movie Header Banner -->
            <div class="bg-neutral-900/70 border border-neutral-800 rounded-2xl p-5 mb-6 flex flex-col sm:flex-row gap-5">
                <img id="session-movie-poster" src="" alt="" class="w-24 sm:w-28 aspect-[2/3] object-cover rounded-xl border border-neutral-800 bg-neutral-950 shrink-0">
                <div class="flex flex-col justify-center">
                    <h2 id="session-movie-title" class="text-xl sm:text-2xl font-black text-neutral-100 mb-1 leading-tight"></h2>
                    <div id="session-movie-meta" class="text-xs font-semibold text-cyan-400 mb-2"></div>
                    <p id="session-movie-synopsis" class="text-xs text-neutral-400 line-clamp-3 leading-relaxed max-w-3xl"></p>
                </div>
            </div>

            <!-- Day Selector Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4" id="day-tabs"></div>

            <!-- Sessions Cards Grid -->
            <div id="sessions-content"></div>
        </section>

    </main>

    <!-- Modal: Preferred Area Configuration -->
    <div id="preferred-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl flex flex-col gap-5">
            <div class="flex items-center justify-between pb-3 border-b border-neutral-800">
                <div>
                    <h3 class="text-base font-bold text-neutral-100 flex items-center gap-2">
                        <span>⚡ Configure Preferred Viewing Area</span>
                    </h3>
                    <p class="text-xs text-neutral-400 mt-0.5">Choose presets or click directly on the blueprint to toggle custom seats.</p>
                </div>
                <button onclick="PreferredModule.closePreferredModal()" class="w-8 h-8 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold flex items-center justify-center transition-colors">
                    &times;
                </button>
            </div>

            <!-- Presets -->
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-bold text-neutral-400">Presets:</span>
                <button onclick="PreferredModule.applyPreset('colombo_imax_prime')" class="px-2.5 py-1 rounded bg-neutral-800 hover:bg-amber-400/20 hover:text-amber-300 text-xs font-medium text-neutral-300 transition-colors border border-neutral-700">
                    IMAX Prime Center (E17-E18, F17-F18)
                </button>
                <button onclick="PreferredModule.applyPreset('colombo_imax_center')" class="px-2.5 py-1 rounded bg-neutral-800 hover:bg-amber-400/20 hover:text-amber-300 text-xs font-medium text-neutral-300 transition-colors border border-neutral-700">
                    IMAX Sweet Spot (Rows E-F, 16-19)
                </button>
                <button onclick="PreferredModule.applyPreset('colombo_imax_wide')" class="px-2.5 py-1 rounded bg-neutral-800 hover:bg-amber-400/20 hover:text-amber-300 text-xs font-medium text-neutral-300 transition-colors border border-neutral-700">
                    IMAX Wide Center (Rows D-G)
                </button>
            </div>

            <!-- Active Chips -->
            <div class="p-3 bg-neutral-950 rounded-xl border border-neutral-800">
                <div class="text-[11px] font-bold text-neutral-400 mb-2">Active Preferred Seats:</div>
                <div id="preferred-chips-list" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto"></div>
            </div>

            <!-- Interactive Blueprint -->
            <div class="flex flex-col items-center">
                <div class="text-xs font-bold text-cyan-400 mb-2">Interactive Blueprint (Click seats to add/remove)</div>
                <div id="modal-seatmap-blueprint" class="w-full flex justify-center overflow-x-auto"></div>
            </div>

            <div class="flex justify-end pt-3 border-t border-neutral-800">
                <button onclick="PreferredModule.closePreferredModal()" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-neutral-950 text-xs font-bold transition-colors">
                    Done & Apply
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="seatmap.js"></script>
    <script src="preferred.js"></script>
    <script src="app.js"></script>
</body>
</html>
